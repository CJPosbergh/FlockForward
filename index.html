<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>Flock Forward</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700&family=Zilla+Slab:wght@500;600&display=swap">
<style>
/* Layout: sticky top bar, season rail on the left (stacks above content on phones), work area with tables framed in their own scroll boxes */
:root {
  --bg: #F1F3EE; --surface: #FBFCF9; --surface-2: #E8ECE5; --ink: #1C2520; --ink-2: #48554D; --muted: #6E7C73; --line: #D2D9CF; --line-2: #BCC5BA;
  --accent: #1F5F8B; --accent-ink: #FFFFFF; --accent-soft: #DCE7F0;
  --good: #1E7438; --good-soft: #DCEEDF; --warn: #8E5B00; --warn-soft: #F5E9CF; --bad: #A93232; --bad-soft: #F5DDDA;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --shadow: 0 1px 2px rgba(28, 37, 32, .06), 0 4px 16px rgba(28, 37, 32, .06);
  --font-display: 'Zilla Slab', 'Rockwell', Georgia, serif;
  --font-body: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #18201B; --surface-2: #212A24; --ink: #E4EAE3; --ink-2: #B2BDB5; --muted: #8A978E; --line: #2C3730; --line-2: #3A473F;
    --accent: #7DB2DB; --accent-ink: #0D1A23; --accent-soft: #1C3243;
    --good: #72C98C; --good-soft: #193022; --warn: #E0B25B; --warn-soft: #362C16; --bad: #EE8C82; --bad-soft: #3A1E1C;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #18201B; --surface-2: #212A24; --ink: #E4EAE3; --ink-2: #B2BDB5; --muted: #8A978E; --line: #2C3730; --line-2: #3A473F;
  --accent: #7DB2DB; --accent-ink: #0D1A23; --accent-soft: #1C3243;
  --good: #72C98C; --good-soft: #193022; --warn: #E0B25B; --warn-soft: #362C16; --bad: #EE8C82; --bad-soft: #3A1E1C;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.12rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.num { text-align: right; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 16px;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 1.35rem; letter-spacing: .01em; }
.brand .flock { color: var(--muted); font-size: .85rem; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav button { border: 0; background: none; padding: 6px 10px; border-radius: var(--r); cursor: pointer; color: var(--ink-2); font-weight: 500; }
.nav button:hover { background: var(--surface-2); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.season-pill { margin-left: auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.kv { display: flex; flex-direction: column; line-height: 1.15; }
.kv b { font-family: var(--font-data); font-size: .95rem; font-weight: 600; }
.kv span { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }

.banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner p { flex: 1 1 240px; }

/* shell */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 16px; padding-block: 16px 48px; max-width: 1500px; margin: 0 auto; }
.shell.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); } }

.rail { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 76px; align-self: start; }
.rail .yr { font-family: var(--font-display); font-size: 1.15rem; margin-bottom: 8px; }
.rail button { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: var(--r); cursor: pointer; color: var(--ink-2); }
.rail button .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-family: var(--font-data); font-size: .72rem; }
.rail button .t { display: flex; flex-direction: column; line-height: 1.2; }
.rail button .t small { color: var(--muted); font-size: .74rem; }
.rail button:hover { background: var(--surface-2); }
.rail button[aria-current="step"] { background: var(--surface); box-shadow: var(--shadow); color: var(--ink); font-weight: 600; }
.rail button[aria-current="step"] .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rail button.done .n { border-color: var(--good); color: var(--good); }
@media (max-width: 860px) {
  .rail { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .rail .yr { display: none; }
  .rail button { grid-template-columns: 22px auto; white-space: nowrap; }
  .rail button .t small { display: none; }
}

.main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 20px; justify-content: space-between; }
.head p { max-width: 68ch; color: var(--ink-2); margin-top: 4px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel > h3 + * { margin-top: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }

/* stat strip */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.stat b { font-family: var(--font-data); font-size: 1.2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: .74rem; color: var(--muted); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 3px 8px; font-size: .82rem; }
input[type="number"], input[type="text"], select, textarea { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 5px 8px; min-width: 0; }
input[type="number"] { width: 6.5em; font-family: var(--font-data); }
textarea { width: 100%; font-family: var(--font-data); font-size: .78rem; }
label.inline { display: inline-flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; }

/* tables */
.tframe { overflow: auto; max-height: 62vh; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .82rem; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 1; text-align: left; font-weight: 600; font-size: .74rem; color: var(--ink-2); cursor: pointer; user-select: none; }
thead th.num { text-align: right; }
thead th[aria-sort] { color: var(--ink); }
tbody tr:hover td { background: var(--surface-2); }
tbody tr:has(input[type="checkbox"]:not(:disabled)) { cursor: pointer; }
tbody tr.sel td { background: var(--accent-soft); }
tbody tr.gone td { color: var(--muted); text-decoration: line-through; }
td.tag button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-family: var(--font-data); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 2px; }
td input[type="checkbox"], th input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.fav { color: var(--good); } .unf { color: var(--bad); }
.ledger td:first-child { white-space: normal; }
.ledger tr.total td { font-weight: 700; border-top: 2px solid var(--line-2); }

/* badges */
.badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-family: var(--font-data); font-size: .74rem; font-weight: 600; border: 1px solid transparent; }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.neutral { background: var(--surface-2); color: var(--ink-2); }
.badge.unk { color: var(--muted); border-color: var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 4px; border: 1px solid var(--line); border-radius: 999px; font-size: .8rem; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }

.msg { padding: 10px 12px; border-radius: var(--r); display: flex; gap: 10px; align-items: flex-start; }
.msg.err { background: var(--bad-soft); }
.msg.warn { background: var(--warn-soft); }
.msg.ok { background: var(--good-soft); }
.msg.info { background: var(--accent-soft); }
.msg .ic { font-weight: 700; font-family: var(--font-data); }

/* market cards */
.lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.lot { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.lot.bought { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.lot.gone { opacity: .55; }
.lot header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lot header b { font-family: var(--font-display); font-size: 1.1rem; }
.lot .price { font-family: var(--font-data); font-weight: 600; font-size: 1.05rem; }
.lot dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; margin: 0; }
.lot dt { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.lot dd { margin: 0; font-family: var(--font-data); font-size: .85rem; }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .ttl { font-weight: 600; font-size: .88rem; margin-bottom: 2px; }
.chart .sub { font-size: .74rem; color: var(--muted); margin-bottom: 6px; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 5px 8px; border-radius: 4px; font-size: .76rem; font-family: var(--font-data); white-space: nowrap; z-index: 3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink-2); margin-top: 4px; }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 40; overflow: auto; padding: 16px; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.drawer header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.drawer h2 { font-family: var(--font-data); font-size: 1.3rem; }
.ped { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; font-size: .78rem; align-items: center; }
.ped div { border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font-family: var(--font-data); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ped .self { grid-row: span 4; align-self: center; background: var(--accent-soft); }
.ped .par { grid-row: span 2; }
.accbar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; width: 70px; display: inline-block; vertical-align: middle; }
.accbar i { display: block; height: 100%; background: var(--accent); }

.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); z-index: 60; display: grid; place-items: center; }
.overlay .box { background: var(--surface); padding: 22px 28px; border-radius: var(--r); box-shadow: var(--shadow); font-family: var(--font-display); font-size: 1.2rem; text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); z-index: 70; font-size: .88rem; max-width: calc(100% - 32px); }

.prose { max-width: 72ch; display: flex; flex-direction: column; gap: 10px; }
.prose h3 { margin-top: 10px; }
.prose ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px 16px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: .8rem; color: var(--ink-2); }
.form label input { width: 100%; }
details summary { cursor: pointer; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .lot, .btn, .rail button { transition: background-color .15s, box-shadow .15s; } }
</style>

<script>
/* ============================================================
   FleeceLine flock simulation engine
   Targhee range flock: polygenic traits + PRNP, FecB, TMEM154
   ============================================================ */
(function (global) {
'use strict';

const LB_PER_KG = 2.20462262;

/* ---------- random numbers (seeded, deterministic) ---------- */
function hash32(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function makeRng(seedStr) {
  let a = hash32(seedStr);
  const u = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  let spare = null;
  const n = () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let x, y, r;
    do { x = 2 * u() - 1; y = 2 * u() - 1; r = x * x + y * y; } while (r >= 1 || r === 0);
    const f = Math.sqrt(-2 * Math.log(r) / r); spare = y * f; return x * f;
  };
  return {
    u, n,
    bern: p => u() < p,
    int: k => Math.floor(u() * k),
    shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(u() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
  };
}

/* ---------- traits and genetic parameters ---------- */
const T = { PWWT: 0, MWWT: 1, YWT: 2, YGFW: 3, YFD: 4, NLB: 5 };
const TRAITS = [
  { key: 'PWWT', label: 'Post-weaning weight', unit: 'lb', dp: 2, good: +1, h2: 0.25 },   // simulated in kg, shown in lb
  { key: 'MWWT', label: 'Maternal weaning weight', unit: 'lb', dp: 2, good: +1, h2: 0.10 },
  { key: 'YWT',  label: 'Yearling weight', unit: 'lb', dp: 2, good: -1, h2: 0.40 },
  { key: 'YGFW', label: 'Yearling fleece weight', unit: 'lb', dp: 2, good: +1, h2: 0.40 },
  { key: 'YFD',  label: 'Yearling fiber diameter', unit: 'µm', dp: 2, good: -1, h2: 0.55 },
  { key: 'NLB',  label: 'Number of lambs born', unit: 'lambs', dp: 3, good: +1, h2: 0.10 }
];
const NLB_SLOPE = 0.77;           // propensity scale -> observed lambs born per ewe
const SA = [2.75, 1.74, 3.80, 0.38, 1.04, 0.24];  // additive SD (NLB on propensity scale)
const RG = [
  [1.00, 0.00, 0.75, 0.25, 0.15, 0.10],
  [0.00, 1.00, 0.10, 0.00, 0.00, 0.05],
  [0.75, 0.10, 1.00, 0.30, 0.20, 0.15],
  [0.25, 0.00, 0.30, 1.00, 0.30, 0.00],
  [0.15, 0.00, 0.20, 0.30, 1.00, 0.00],
  [0.10, 0.05, 0.15, 0.00, 0.00, 1.00]
];
function cholesky(M) {
  const n = M.length, L = M.map(r => r.map(() => 0));
  for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
    let s = M[i][j]; for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
    if (i === j) { if (s <= 0) throw new Error('G not positive definite'); L[i][i] = Math.sqrt(s); }
    else L[i][j] = s / L[j][j];

const G = RG.map((r, i) => r.map((v, j) => v * SA[i] * SA[j]));
const LG = cholesky(G);
function drawBV(rng, scale) {
  const z = SA.map(() => rng.n()), out = new Array(6).fill(0);
  for (let i = 0; i < 6; i++) { let s = 0; for (let k = 0; k <= i; k++) s += LG[i][k] * z[k]; out[i] = s * scale; }
  return out;
}
// observed-scale true BV (what an EBV estimates)
const obsBV = (a, t) => t === T.NLB ? a[t] * NLB_SLOPE : a[t];
const obsSA = t => t === T.NLB ? SA[t] * NLB_SLOPE : SA[t];

const P = {
  pwMean: 44, pwSexM: 3.5, pwC: 1.55, pwE: 4.16,
  pwBirth: { 1: 0, 2: -3.5, 3: -6.0, 4: -7.5 },
  pwDamAge: a => a <= 2 ? -2.5 : a === 3 ? -0.8 : a >= 7 ? -1.0 : 0,
  ywMean: 60, ywSexM: 18, ywE: 4.65, ywBirth: { 1: 0, 2: -2.0, 3: -3.5, 4: -4.0 },
  gfMean: 4.9, gfSexM: 0.6, gfPE: Math.sqrt(0.08), gfE: Math.sqrt(0.136), gfBirth: { 1: 0, 2: -0.15, 3: -0.25, 4: -0.3 },
  gfAge: a => a <= 1 ? 0 : a === 2 ? 0.5 : a <= 5 ? 0.6 : 0.4,

/* ============ charts ============ */
const CH = {}; let chN = 0;
function niceTicks(lo, hi, n) {
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0 / mag;
  const step = (r >= 5 ? 10 : r >= 2 ? 5 : r >= 1 ? 2 : 1) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}
function chart(o) {
  // o: {title, sub, xs:[labels], series:[{name, v:[], color, dash}], yFmt, bars, zero, h}
  const id = 'ch' + (chN++), W = 330, H = o.h || 170, m = { l: 46, r: 12, t: 10, b: 24 };
  const all = o.series.flatMap(s => s.v.filter(v => v != null && !isNaN(v)));
  let head = `<div class="ttl">${esc(o.title)}</div>${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}`;
  if (!all.length) return `<div class="chart">${head}<p class="muted small">No data yet.</p></div>`;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (o.zero || o.bars) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  if (hi - lo < 1e-9) { if (Math.abs(hi) < 1e-9) { lo = 0; hi = 1; } else { hi += Math.abs(hi) * 0.1; lo -= Math.abs(lo) * 0.1; } }
  const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const tstep = ticks.length > 1 ? ticks[1] - ticks[0] : 1, tdp = Math.max(0, -Math.floor(Math.log10(tstep) + 1e-9));
  const tf = o.kind === 'pct' ? (v => (v * 100).toFixed(Math.max(0, tdp - 2)) + '%') : o.kind === 'money' ? (v => money(v)) : o.kind === 'signed' ? (v => sgn(v, tdp)) : (v => fmt(v, tdp));
  const n = o.xs.length, pw = W - m.l - m.r;
  const X = i => o.bars ? m.l + (i + 0.5) * pw / n : m.l + (n <= 1 ? pw / 2 : i * pw / (n - 1));
  const Y = v => m.t + (hi - v) * (H - m.t - m.b) / (hi - lo);
  const yf = o.yFmt || (v => fmt(v, 1));
  let svg = '';
  for (const t of ticks) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" style="stroke:var(--line);stroke-width:${t === 0 && lo < 0 ? 1.4 : 1}"/><text x="${m.l - 6}" y="${Y(t) + 3.5}" text-anchor="end" style="fill:var(--muted);font-size:10px;font-family:var(--font-data)">${esc(tf(t))}</text>`;
  const every = Math.max(1, Math.ceil(n / 7));
  o.xs.forEach((x, i) => { if ((n - 1 - i) % every === 0) svg += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" style="fill:var(--muted);font-size:10px;font-family:var(--font-data)">${esc(x)}</text>`; });
  o.series.forEach((s, k) => {
    const col = s.color || SERIES[k];
    if (o.bars) {
      const bw = Math.max(4, pw / n * 0.62);
      s.v.forEach((v, i) => { if (v == null) return; const y0 = Y(0), y1 = Y(v); svg += `<rect x="${X(i) - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(1, Math.abs(y1 - y0))}" rx="2" style="fill:${v < 0 ? 'var(--bad)' : col}"/>`; });
      return;
    }
    let d = '', pen = false;
    s.v.forEach((v, i) => { if (v == null || isNaN(v)) { pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
    svg += `<path d="${d}" style="fill:none;stroke:${col};stroke-width:2;stroke-linejoin:round;stroke-linecap:round${s.dash ? ';stroke-dasharray:5 4' : ''}"/>`;
    s.v.forEach((v, i) => { if (v == null || isNaN(v)) return; const iso = (i === 0 || s.v[i - 1] == null) && (i === s.v.length - 1 || s.v[i + 1] == null); if (iso) svg += `<circle cx="${X(i)}" cy="${Y(v)}" r="3" style="fill:${col}"/>`; });
    let li = -1; s.v.forEach((v, i) => { if (v != null && !isNaN(v)) li = i; });
    if (li >= 0) svg += `<circle cx="${X(li)}" cy="${Y(s.v[li])}" r="3.5" style="fill:${col};stroke:var(--surface);stroke-width:2"/>`;
  });
  svg += `<line class="hl" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" style="stroke:var(--ink-2);stroke-width:1;visibility:hidden"/>`;
  svg += `<rect x="${m.l}" y="${m.t}" width="${pw}" height="${H - m.t - m.b}" style="fill:transparent" data-hover="${id}"/>`;
  CH[id] = { o, X, W, n, yf };
  const legend = o.series.length > 1 ? `<div class="legend">${o.series.map((s, k) => `<span><i class="${s.dash ? 'dash' : ''}" style="background:${s.color || SERIES[k]};color:${s.color || SERIES[k]}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart" data-chart="${id}">${head}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title)}">${svg}</svg>${legend}<div class="tip" hidden></div></div>`;
}
document.addEventListener('pointermove', e => {
  const r = e.target.closest && e.target.closest('[data-hover]');
  document.querySelectorAll('.chart .tip:not([hidden])').forEach(t => { if (!r || t.parentElement.dataset.chart !== r.dataset.hover) { t.hidden = true; const hl = t.parentElement.querySelector('.hl'); if (hl) hl.style.visibility = 'hidden'; } });
  if (!r) return;
  const c = CH[r.dataset.hover]; if (!c) return;
  const svg = r.ownerSVGElement, box = svg.getBoundingClientRect(), vx = (e.clientX - box.left) / box.width * c.W;
  let best = 0, bd = 1e9; for (let i = 0; i < c.n; i++) { const d = Math.abs(c.X(i) - vx); if (d < bd) { bd = d; best = i; } }
  const wrap = svg.parentElement, tip = wrap.querySelector('.tip'), hl = svg.querySelector('.hl');
  hl.setAttribute('x1', c.X(best)); hl.setAttribute('x2', c.X(best)); hl.style.visibility = 'visible';
  tip.innerHTML = `<b>${esc(c.o.xs[best])}</b>` + c.o.series.map(s => `<br>${c.o.series.length > 1 ? esc(s.name) + ': ' : ''}${s.v[best] == null ? '—' : esc(c.yf(s.v[best]))}`).join('');
  tip.hidden = false;
  const px = c.X(best) / c.W * box.width, wr = wrap.getBoundingClientRect();
  tip.style.left = Math.min(Math.max(0, px + (box.left - wr.left) - tip.offsetWidth / 2), wr.width - tip.offsetWidth) + 'px';

function joinPlan() {
  const ed = engineDec(), key = JSON.stringify([ed.sires, ed.cull, ed.method, ed.quotas, ed.assign, st.animals.length, st.year]);

  for (const m of plan) { byEwe[m.e] = m; if (m.term) continue; const p = per[m.s] || (per[m.s] = { n: 0, f: 0, man: 0 }); p.n++; if (m.m) p.man++; }
  for (const id of ed.sires) cols[id] = SIM.relColumn(st, id);
  for (const m of plan) {
    if (m.term) { m.fn = 0; m.f = 0; continue; }
    if (m.ai && !cols[m.ai]) cols[m.ai] = SIM.relColumn(st, m.ai);
    m.fn = 0.5 * cols[m.s][m.e]; m.f = m.ai ? 0.5 * cols[m.ai][m.e] : m.fn; per[m.s].f += m.fn;

}

    <div class="stat"><b>${ewes}</b><span>ewes to join${nTerm ? ` (${nTerm} to terminal)` : ''}</span></div>
    <div class="stat"><b class="${short ? 'unf' : ''}">${used.length} / ${need}+</b><span>Targhee sires used / needed</span></div>
    <div class="stat"><b>${(jp.sm.meanF * 100).toFixed(2)}%</b><span>mean inbreeding of lambs</span></div>
    <div class="stat"><b>${(jp.sm.maxF * 100).toFixed(1)}%</b><span>highest single mating</span></div>
    <div class="stat"><b>${sgn(jp.sm.pa, 1)}</b><span>expected lamb index $ (parent average)</span></div>
    ${aiCatalog().length ? (() => { const a = aiPlanned(); return `<div class="stat"><b>${a.nai} · ${money(a.ai)}</b><span>ewes bred by AI · AI cost</span></div>`; })() : ''}
  </div>
  <div class="row"><span>Ewes on Auto:</span><div class="seg" role="group" aria-label="Mating method">
    <button data-act="method" data-v="mininbreed" aria-pressed="${d.method === 'mininbreed'}">Avoid related matings</button>
    <button data-act="method" data-v="random" aria-pressed="${d.method === 'random'}">At random</button></div>
    <span class="small muted">Leave a ram's ewe count on auto to split ewes evenly.</span></div>
  <div class="tframe" data-scroll="join"><table><thead><tr><th></th>${thS('join', 'rad', 'Raddle')}${thS('join', 'tag', 'Tag')}${thS('join', 'age', 'Age', 1)}${[0, 1, 2, 3, 4, 5].map(t => thS('join', 'e' + t, TR[t].key, 1)).join('')}${thS('join', 'ix', 'Index $', 1)}${thS('join', 'acc', 'Acc', 1)}${thS('join', 'prnp', 'PRNP')}${thS('join', 'fec', 'FecB')}${thS('join', 'tm', 'TMEM154')}<th>Ewes (set)</th>${thS('join', 'n', 'Ewes', 1, 'Ewes in this ram\'s group')}${thS('join', 'lf', 'Lamb F', 1, 'Mean inbreeding of his lambs')}</tr></thead>
  <tbody>${rows || '<tr><td colspan="18" class="muted">No rams 1 year or older are available. Buy rams at the sale.</td></tr>'}</tbody></table></div>
  ${termPanel(jp, ewes)}
  ${renderMatesTable(jp)}`;
}
function termPanel(jp, ewes) {
  const s = st.settings, nTerm = jp.sm.nTerm || 0, nRams = Math.ceil(nTerm / s.maxEwesPerRam);
  const be = SIM.breedersEq(st, jp.plan);
  const short = be.expEweLambs < be.needRepl;
  return `<section class="panel stack"><h3>Terminal sire (Suffolk)</h3>
    <p class="small">Ewes bred to a Suffolk ram have crossbred lambs that grow faster (about ${s.termPWlb} lb heavier at weaning, from the breed difference plus hybrid vigor) and survive a little better, but every crossbred lamb is sold: none can be kept as a replacement. Terminal rams cost ${money(s.termRamCost)} each per year, and each covers up to ${s.maxEwesPerRam} ewes. Crossbred lambs carry no records into your Targhee EBVs.</p>
    <div class="row">
      <label class="inline">Send the bottom <input type="number" id="termN" min="0" step="1" value="${UI.termN != null ? UI.termN : Math.round(s.flockSize * 0.25)}"> ewes by ${rankSelect()}</label><button class="btn sm" data-act="termbottom">to terminal</button>
      <label class="inline">Ewes aged <input type="number" id="termAge" min="2" max="8" value="${UI.termAge || 6}"> +</label><button class="btn sm" data-act="termage">to terminal</button>
      <button class="btn sm" data-act="termclear" ${nTerm ? '' : 'disabled'}>Clear terminal</button></div>
    <div class="stats">
      <div class="stat"><b>${nTerm}</b><span>ewes to the terminal sire</span></div>
      <div class="stat"><b>${nRams} · ${money(nRams * s.termRamCost)}</b><span>terminal rams needed · cost</span></div>
      <div class="stat"><b>${ewes - nTerm}</b><span>ewes bred purebred</span></div>
      <div class="stat"><b class="${short ? 'unf' : ''}">~${be.expEweLambs}</b><span>purebred ewe lambs expected next spring (about ${be.needRepl} needed to hold flock size)</span></div>
    </div>
    ${short ? `<div class="msg warn"><span class="ic">!</span><p>At this level you may not raise enough purebred ewe lambs to replace the ewes that leave each year, so you'd have to keep nearly every ewe lamb and lose selection pressure.</p></div>` : ''}</section>`;
}
function renderCommit() {
  const ed = engineDec(), v = SIM.validate(st, ed), pr = projection(), L = SIM.ledger(st, st.year);
  const g = SIM.currentGroups(st), d = dec();

  const mean = (a, f) => a.length ? sum(a, f) / a.length : null;
  return `<div class="head"><div><span class="eyebrow">Step 8</span><h2>End the year</h2>
  <p>Check your plan, then end the year. The flock winters on the range, ewes lamb in spring, everything is shorn and weighed, and EBVs are recalculated. You can't undo this step.</p></div></div>
  ${v.errs.map(e => `<div class="msg err"><span class="ic">✕</span><p>${esc(e)}</p></div>`).join('')}

  <div class="grid2">
    <section class="panel"><h3>Your plan</h3><table><tbody>
      <tr><td>Ewe lambs kept</td><td class="num mono">${keptE.length}</td><td class="num mono">index ${sgn(mean(keptE, x => x.ix), 1)}</td></tr>

      <tr><td>Lambs sold</td><td class="num mono">${pr.n}</td><td class="num mono">${fmt(mean(g.eweLambs.concat(g.ramLambs).filter(x => !has(d.retain, x.id)), x => dv(0, x.pwwt || 0)), 1)} lb avg</td></tr>

      ${Object.keys(d.bids).length && round() < st.settings.rounds ? `<tr><td>Ram sale bids</td><td class="num mono">${Object.keys(d.bids).length}</td><td class="num mono">up to ${money(sum(Object.values(d.bids), v => +v || 0))}</td></tr>` : ''}
      ${pr.nterm ? `<tr><td>Ewes to the terminal sire</td><td class="num mono">${pr.nterm}</td><td class="num mono">${money(pr.term)}</td></tr>` : ''}
      ${Object.keys(ed.noms || {}).length ? `<tr><td>Rams nominated for AI</td><td class="num mono">${Object.keys(ed.noms).length}</td><td class="num mono">${Object.keys(ed.noms).map(id => tag(+id)).join(', ')}</td></tr>` : ''}
    </tbody></table></section>
    <section class="panel"><h3>Money for ${cal(st.year)}</h3>${ledgerTable(L, pr)}</section>
  </div>
  ${beqPanel()}

}

/* ============ breeder's equation (shown before ending the year) ============ */
function beqPanel() {
  const be = SIM.breedersEq(st, joinPlan().plan), s = st.settings;
  const f2 = v => (v == null || isNaN(v) ? '—' : v.toFixed(2)), mS = be.sire, fD = be.dam;
  const last = st.beq && st.beq[st.year];
  const crop = st.animals.filter(x => x.by === st.year && x.org === 'b' && !x.term && x.ix != null);
  const cropNow = crop.length ? sum(crop, x => x.ix) / crop.length : null;
  const pNext = be.keepShare, iNext = pNext != null && pNext < 1 ? SIM.intensityFor(pNext) : 0;
  const row = (label, a, b, note) => `<tr><td>${label}${note ? `<div class="small muted">${note}</div>` : ''}</td><td class="num mono">${a}</td><td class="num mono">${b}</td></tr>`;
  return `<section class="panel stack"><h3>Breeder's equation: what this plan should do</h3>
    <p class="small">Genetic gain per year = (S<sub>sires</sub> + S<sub>dams</sub>) ÷ (L<sub>sires</sub> + L<sub>dams</sub>), and each selection differential S = i × r × σ<sub>A</sub>. S is a parent's index EBV minus the average of the flock lambs born the same year as it (its contemporaries); L is its age when this spring's lambs are born. AI sires count for the share of ewes that settle to AI (${pct(s.aiRate)}), and ewes going to the terminal sire are left out because their lambs won't be kept.</p>
    <div class="tframe" style="max-height:none"><table><thead><tr><th></th><th class="num">Sires</th><th class="num">Dams</th></tr></thead><tbody>
      ${row('Animals used', mS.n, fD.n)}
      ${row('Selection differential S, index $', sgn(mS.S, 1), sgn(fD.S, 1), 'How far above their contemporaries the parents you chose are')}
      ${row('Accuracy r of their index EBVs', f2(mS.r), f2(fD.r), 'Higher with own records, progeny, genotypes')}
      ${row('Selection intensity i (= S ÷ r σ<sub>A</sub>)', f2(mS.i), f2(fD.i), 'Keeping the top 50% gives about 0.80, top 20% 1.40, top 5% 2.06')}
      ${row('Generation interval L, years', f2(mS.L), f2(fD.L), 'Older parents slow gain per year')}
    </tbody></table></div>
    <div class="stats">
      <div class="stat"><b>$${be.sigma.toFixed(0)}</b><span>genetic SD of the index, σ<sub>A</sub></span></div>
      <div class="stat"><b class="${be.dG < 0 ? 'unf' : ''}">${sgn(be.dG, 2)}</b><span>predicted genetic gain, index $ per ewe per year</span></div>
      <div class="stat"><b>${sgn(be.pa, 1)}</b><span>expected index of next spring's purebred lambs (parent average)</span></div>
      <div class="stat"><b>${sgn(cropNow, 1)}</b><span>this spring's purebred lambs, average index</span></div>
    </div>
    ${be.nTerm ? `<p class="small"><b>Terminal sire:</b> ${be.nTerm} ewes go to the Suffolk, so about ${be.expEweLambs} purebred ewe lambs are expected next spring. Replacing the roughly ${be.needRepl} ewes that leave each year means keeping ${pNext != null ? pct(Math.min(1, pNext)) : '—'} of them${pNext != null && pNext < 1 ? `, a selection intensity of about ${iNext.toFixed(2)} on the dam side next year` : ': every one, with no room to select'}.</p>`
      : `<p class="small">With every ewe bred purebred, about ${be.expEweLambs} purebred ewe lambs are expected next spring. Replacing the roughly ${be.needRepl} ewes that leave each year means keeping ${pct(Math.min(1, pNext || 0))} of them${pNext < 1 ? ` (intensity about ${iNext.toFixed(2)})` : ''}.</p>`}
    ${last ? `<p class="small"><b>Last fall's prediction:</b> your plan expected this spring's purebred lambs to average ${sgn(last.pa, 1)} (parent average, on last year's EBVs). On today's EBVs they average ${sgn(cropNow, 1)}. Last year's predicted gain was ${sgn(last.dG, 2)} per year.</p>` : ''}
  </section>`;
}

/* ============ final report ============ */
function trendsData() {

}

  </div>
  <div class="grid2">

    <tr><td>PRNP ARR (scrapie resistance) allele</td><td class="num mono">${pct(fl.arr)}</td></tr>
    <tr><td>FecB Booroola allele</td><td class="num mono">${pct(fl.fecB)}</td></tr>

  </tbody></table></section></div>
  ${trendCharts(true)}`;

/* ============ trends ============ */
function trendCharts(reveal) {
  const tr = trendsData(), xs = tr.map(b => String(cal(b.y)));
  const one = (t) => chart({
    title: TR[t].label + ' (' + TR[t].unit + ')', sub: 'Mean of lambs by birth year' + (TR[t].good < 0 ? ', lower is better' : ''),
    xs, series: [{ name: 'EBV', v: tr.map(b => dv(t, b.e[t])) }].concat(reveal ? [{ name: 'True BV', v: tr.map(b => dv(t, b.t[t])), dash: true, color: 'var(--s2)' }] : []),
    yFmt: v => sgn(v, EBV_DP[t]), kind: 'signed'
  });
  const idx = chart({ title: 'Targhee Range Index ($)', sub: 'Mean index of lambs by birth year', xs,
    series: [{ name: 'EBV index', v: tr.map(b => b.ix) }].concat(reveal ? [{ name: 'True index', v: tr.map(b => b.tix), dash: true, color: 'var(--s2)' }] : []), yFmt: v => sgn(v, 1), kind: 'signed' });
  const hy = Object.keys(st.hist).map(Number).filter(y => y >= 2).sort((a, b) => a - b), hx = hy.map(y => String(cal(y)));
  const H = st.hist;
  const ly = Object.keys(st.led).map(Number).filter(y => y >= st.firstRound).sort((a, b) => a - b);
  const perf = [
    chart({ title: 'Weaning rate', sub: 'Lambs weaned per ewe joined', xs: hx, series: [{ name: 'Weaning', v: hy.map(y => H[y].exposed ? H[y].weaned / H[y].exposed : null) }], yFmt: v => pct(v), kind: 'pct' }),
    chart({ title: 'Mean 120-day weight (lb)', sub: 'All lambs weighed', xs: hx, series: [{ name: 'PWWT', v: hy.map(y => dv(0, H[y].meanPW)) }] }),
    chart({ title: 'Mean fiber diameter (µm)', sub: 'All fleeces shorn, lower is better', xs: hx, series: [{ name: 'FD', v: hy.map(y => H[y].meanFD) }] }),
    chart({ title: 'Mean greasy fleece weight (lb)', sub: 'All fleeces shorn', xs: hx, series: [{ name: 'GFW', v: hy.map(y => H[y].meanGFW == null ? null : H[y].meanGFW * LB) }], yFmt: v => fmt(v, 2) })
  ];
  const known = [];
  const kb = {};
  for (const x of st.animals) { if (x.org !== 'b' || x.by < 2 || !x.gk) continue; const b = kb[x.by] || (kb[x.by] = { n: 0, arr: 0, b: 0, k: 0 }); b.n++; b.arr += (x.prnp[0] === 0) + (x.prnp[1] === 0); b.b += x.fec[0] + x.fec[1]; b.k += SIM.tmLow(x.tm); }
  const freqSeries = reveal
    ? [{ name: 'PRNP ARR', v: tr.map(b => b.arr) }, { name: 'FecB B', v: tr.map(b => b.fecB) }, { name: 'TMEM154 hap 1+4', v: tr.map(b => b.tmK) }]
    : [{ name: 'PRNP ARR', v: tr.map(b => kb[b.y] ? kb[b.y].arr / (2 * kb[b.y].n) : null) }, { name: 'FecB B', v: tr.map(b => kb[b.y] ? kb[b.y].b / (2 * kb[b.y].n) : null) }, { name: 'TMEM154 hap 1+4', v: tr.map(b => kb[b.y] ? kb[b.y].k / (2 * kb[b.y].n) : null) }];
  return `<section class="panel stack"><h3>Genetic trend</h3><div class="charts">${idx}${[4, 3, 0, 1, 2, 5].map(one).join('')}</div></section>
  <section class="panel stack"><h3>Flock performance and money</h3><div class="charts">${perf.join('')}
    ${chart({ title: 'Net income per ewe exposed ($)', sub: 'Each production year since round 1', xs: ly.map(y => String(cal(y))), series: [{ name: 'Net per ewe', v: ly.map(y => { const ex = st.hist[y] && st.hist[y].exposed; return ex ? SIM.ledgerNet(st.led[y]) / ex : null; }) }], bars: true, yFmt: v => money2(v), kind: 'money' })}
    ${chart({ title: 'Feeder lamb price, 95-lb lamb ($/lb)', sub: 'Price received each fall; the slide sets lighter and heavier lambs', xs: ly.map(y => String(cal(y))), series: [{ name: 'Lamb', v: ly.map(y => SIM.lambPerLb(st.settings, 95) * SIM.priceFor(st, y).lamb) }], yFmt: v => '$' + v.toFixed(2) })}
    ${chart({ title: 'Wool prices (% of base schedule)', sub: 'Applied to every micron class at shearing', xs: ly.map(y => String(cal(y))), series: [{ name: 'Wool', v: ly.map(y => SIM.priceFor(st, y).wool) }], yFmt: v => pct(v), kind: 'pct' })}
    ${chart({ title: 'Inbreeding (%)', sub: 'Mean F of lambs by birth year', xs, series: [{ name: 'F', v: tr.map(b => b.F * 100) }], yFmt: v => fmt(v, 1) })}
    ${chart({ title: 'Major-gene allele frequencies', sub: reveal ? 'True frequency in lambs by birth year' : 'Among genotyped lambs by birth year', xs, series: freqSeries, yFmt: v => pct(v), kind: 'pct' })}
  </div></section>`;
}
function renderTrends() {
  return `<div class="shell wide"><main class="main"><div class="head"><div><h2>Trends</h2><p>Genetic trend is shown as the mean EBV of each lamb crop. True breeding values stay hidden until the final report.</p></div></div>${trendCharts(finished())}</main></div>`;
}

/* ============ flock book ============ */
function renderBook() {
  const y = st.year, q = UI.search.trim().toLowerCase();

  if (G === 'ewes') rows = rows.filter(x => x.sex === 'F' && x.by < y);
  if (G === 'rams') rows = rows.filter(x => x.sex === 'M' && x.by < y);

  return `<div class="shell wide"><main class="main"><div class="head"><div><h2>Flock book</h2><p>Every sheep in the flock with its records, EBVs and genotypes. Click a tag to open its record card with pedigree and lambing history.</p></div></div>
  <div class="row"><div class="seg" role="group" aria-label="Group">${opts.map(([k, l]) => `<button data-act="bookg" data-v="${k}" aria-pressed="${G === k}">${l}</button>`).join('')}</div>
  <input type="text" id="search" placeholder="Find tag, e.g. 26-0042" value="${esc(UI.search)}" aria-label="Find tag"><span class="spacer"></span><span class="mono small">${rows.length} head</span></div>
  ${table('book', rows, ['tag', 'sex', 'age', 'sire', 'dam', 'bt', 'pwwt', 'ygfw', 'yfd', 'e0', 'e1', 'e2', 'e3', 'e4', 'e5', 'ix', 'acc', 'prnp', 'fec', 'tm', 'opp', 'F'])}
  <div class="row"><button class="btn" data-act="csv">Download flock CSV</button><span class="small muted">Records, EBVs and known genotypes for the current flock, for analysis in R or Excel.</span></div>
  </main></div>`;
}
function flockCSV() {
  const head = ['tag', 'sex', 'birth_year', 'sire', 'dam', 'birth_type', 'rear_type', 'pwwt_lb', 'ywt_lb', 'ygfw_lb', 'yfd', 'nlb_records'].concat(TR.map(t => 'ebv_' + t.key + '_' + t.unit.replace('µ', 'u')), TR.map(t => 'acc_' + t.key), ['index', 'F', 'prnp', 'fecb', 'tmem154', 'opp_test']);
  const lines = [head.join(',')];
  for (const x of st.animals) {
    if (!SIM.inFlock(x)) continue;
    lines.push([tag(x.id), x.sex, cal(x.by), x.sire ? tag(x.sire) : '', x.dam ? tag(x.dam) : '', x.lit, rearType(x) ?? '', x.pwwt == null ? '' : dv(0, x.pwwt).toFixed(1), x.ywt == null ? '' : dv(2, x.ywt).toFixed(1), x.ygfw == null ? '' : dv(3, x.ygfw).toFixed(2), x.yfd ?? '', x.nlb.map(r => r[1]).join('|')]
      .concat(x.e.map((v, t) => dv(t, v).toFixed(3)), x.r.map(v => v.toFixed(2)), [x.ix.toFixed(2), x.F.toFixed(4), x.pk ? SIM.prnpName(x.prnp) : '', x.gk ? SIM.fecName(x.fec) : '', SIM.tmKnown(x) ? SIM.tmName(x.tm) : '', x.ot ? (x.ot[1] ? 'pos' : 'neg') : '']).join(','));
  }
  return lines.join('\n');
}

/* ============ drawer ============ */
function renderDrawer() {
  const x = A(UI.drawer); if (!x) return '';

  return { R, list: Object.values(by), rounds };
}
const majority = arr => { const c = {}; let best = null; for (const v of arr) { c[v] = (c[v] || 0) + 1; if (best === null || c[v] > c[best]) best = v; } return best; };

}

    </tbody></table></div><button class="btn sm" data-act="clsclear">Clear list</button>` : '<p class="small muted">No student games loaded yet. Gains are measured from the lamb crop born the spring before round 1 to the latest crop.</p>'}
  </section>
  <section class="panel stack"><h3>Model notes</h3>
  <ul class="small" style="padding-left:20px;display:flex;flex-direction:column;gap:4px;margin:0"><li>Breeding values follow the infinitesimal model with a 6×6 genetic covariance matrix. Mendelian sampling variance is reduced by parental inbreeding. Inbreeding depresses lamb survival, 120-day weight and yearling weight.</li>
  <li>Litter size uses a threshold model on an underlying propensity, so NLB EBVs are on the observed scale, in lambs per ewe joined.</li>
  <li>The genomic prediction enters BLUP as a pseudo-record. This slightly overstates the extra information it adds beyond parent average.</li>

/* ============ guide ============ */
function renderGuide() {
  const s = st.settings;
  return `<div class="shell wide"><main class="main"><div class="prose">
  <h2>How ${esc(APP_NAME)} works</h2>
  <p>You manage a Targhee range flock for ${s.rounds} breeding years. Targhees were developed at the U.S. Sheep Experiment Station in Dubois, Idaho, as a dual-purpose range breed: heavy lambs plus a fine-medium fleece of about 21 to 25 µm. The breeding goal follows the structure of the NSIP Range Index: more post-weaning growth and maternal weaning weight, finer and heavier fleeces, more lambs, and no increase in mature size. Profit comes from lamb sales, wool and cull sheep, minus upkeep, rams and testing. Lambs sell at their own 120-day weight on a feeder-lamb price slide taken from Billings, MT auction reports, so heavy lambs bring less per pound. Lamb and wool prices also change from year to year. Everyone with the same class code sees the same prices, and the index uses the long-run base prices, the way a breeder plans for the future rather than for one year's market.</p>
  <h3>The yearly cycle</h3>
  <ul><li><b>Spring:</b> ewes lamb, everything is shorn, and lambs are weighed at about 120 days. Yearlings get weight, fleece weight and fiber diameter records.</li>
  <li><b>Fall (your turn):</b> genotype and test, keep replacements, cull, bid on ram lambs, and join ewes to sires.</li>
  <li><b>Ram sale:</b> each fall's sale offers ram lambs, tested for PRNP, FecB and TMEM154. In a class game it is one sealed-bid sale for the whole class, so each ram goes to only one flock: the highest bid wins and pays $25 over the next-highest bid. Rams you win arrive as yearlings with the next class round file and are used that fall.</li>
  <li>Ewe lambs are first bred at about 18 months. Ram lambs can be used the fall after they are born. So 10 rounds is about three generations.</li></ul>
  <h3>Traits and EBVs</h3>
  <ul>${TR.map(t => `<li><b>${t.key}</b>: ${t.label} (${t.unit}), h² ${t.h2.toFixed(2)}${t.good < 0 ? ', lower is better' : ''}.</li>`).join('')}</ul>
  <p>EBVs come from a BLUP animal model fitted to every record and the full pedigree. Contemporary groups are birth year by sex for lamb and yearling traits, and lambing year by ewe age for NLB. PWWT includes a maternal genetic effect, which gives the MWWT EBV, and NLB uses repeated records. Accuracy rises with an animal's own records, its relatives' records, its progeny, and genotyping. The index is in dollars per ewe per year.</p>
  <h3>Major genes</h3>
  <ul><li><b>PRNP</b> (codons 136/154/171): ARR protects against classical scrapie. Codon-171 QQ animals are susceptible, and VRQ carriers are the most susceptible. Each year there is a ${pct(s.scrapieRisk)} chance of exposure. If a case is confirmed, all adults are PRNP-tested at your cost and every QQ animal is removed, with partial indemnity.</li>
  <li><b>FecB (Booroola)</b>: each B copy raises ovulation rate. B+ ewes average roughly half a lamb more per litter, and BB ewes about one more. Triplets survive poorly on the range, though. FecB isn't in the EBV model, so carriers' extra lambs show up in their NLB EBVs and their relatives'.</li>
  <li><b>TMEM154</b>: four haplotypes. Haplotype 1 (K35) is the low-susceptibility allele. Haplotypes 2 and 3 (E35) raise OPP susceptibility, and in the game one copy does most of the damage. Haplotype 4 is a frameshift that makes a non-functional protein, and 4/4 sheep are nearly resistant. Relative infection risk: 2 or 3 copies of susceptible haplotypes 1.0, one copy 0.85, none 0.2, 4/4 0.05.</li></ul>
  <h3>Terminal sire</h3><p>On the Joining step you can send any ewes to a Suffolk ram instead of a Targhee. Their crossbred lambs are about ${s.termPWlb} lb heavier at weaning and survive a little better, but all of them are sold, so they cannot become replacements, and their records do not enter your Targhee EBVs. Terminal rams cost ${money(s.termRamCost)} each per year. The more ewes you send, the fewer purebred ewe lambs you raise, and the less choice you have among them.</p>
  <h3>The breeder's equation</h3><p>Before you end each year, the End the year step shows the breeder's equation for your plan. Genetic gain per year = (S<sub>sires</sub> + S<sub>dams</sub>) ÷ (L<sub>sires</sub> + L<sub>dams</sub>). Each selection differential S is how far your chosen parents' index EBVs sit above their contemporaries, and it splits into selection intensity × accuracy × the genetic standard deviation of the index. L is the generation interval: the parents' age when their lambs are born. The next year's panel compares last year's prediction with the lamb crop you got.</p>
  <h3>AI sires and class rounds</h3>
  <p>In a class game, each round you can nominate up to ${s.maxNominate} of your rams or ram lambs for AI and set a straw price. When the round closes, your instructor puts the top ${s.catalogSize} nominees by index into the next round's catalog. You can then breed any of your ewes to them by laparoscopic AI: ${money(s.aiCost)} per ewe plus the straw, with about ${pct(s.aiRate)} conceiving. The rest are bred by their cleanup ram. You earn the straw price for every ewe another flock breeds to your ram. The catalog doesn't say whose ram is whose. Because every flock in the class began from the same starting flock, an AI sire's pedigree links back to your own animals, and lamb inbreeding is calculated correctly.</p>
  <h3>Genotyping</h3>
  <p>The SNP panel reveals all three major genes and adds a genomic prediction to every EBV. Its accuracy depends on heritability and on the size of the reference population (Daetwyler-style r² = Nh²/(Nh² + Me)). Animals in your own flock that are genotyped and recorded add to that reference.</p>
  </div></main></div>`;
}

function renderOverlays() {
  const el = document.getElementById('overlays'); if (!el) return;
  el.innerHTML = (UI.busy ? `<div class="overlay" role="status"><div class="box">${esc(UI.busy)}</div></div>` : '') + (UI.toast ? `<div class="toast" role="status">${esc(UI.toast)}</div>` : '');
}
function render() {
  if (!st) return;
  const scroll = {}; document.querySelectorAll('[data-scroll]').forEach(e => scroll[e.dataset.scroll] = [e.scrollTop, e.scrollLeft]);
  renderTop();
  const banner = st.practice ? `<div class="banner"><p><b>Practice flock.</b> Try things out here. When your class starts, open Game &amp; saves and start a new game with your name and class code.</p><button class="btn sm" data-act="view" data-v="game">Start class game</button></div>` : '';
  if (UI.view === 'instructor' && !instructorOn()) UI.view = 'season';
  if (UI.view === 'instructor') saveCls();
  const v = { season: renderSeason, book: renderBook, trends: renderTrends, game: renderGame, instructor: renderInstructor, guide: renderGuide }[UI.view]();
  document.getElementById('view').innerHTML = banner + v + (UI.drawer ? renderDrawer() : '');
  document.querySelectorAll('[data-scroll]').forEach(e => { const s = scroll[e.dataset.scroll]; if (s) { e.scrollTop = s[0]; e.scrollLeft = s[1]; } });
}

/* ============ actions ============ */
function ids(attr) { return attr ? attr.split(',').filter(Boolean).map(Number) : []; }
function afterChange(full) { UI.joinCache = null; save(); render(); }
document.addEventListener('click', async e => {
  // clicking anywhere on a table row ticks that row's checkbox (unless the click was on a control in the row)
  const row = e.target.closest('tbody tr');
  if (row && !e.target.closest('input, button, select, label, a, textarea, summary')) {
    const cb = row.querySelector('input[type="checkbox"]:not(:disabled)');
    if (cb) { cb.click(); return; }
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, d = st && !finished() ? dec() : null;
  switch (act) {
    case 'view': UI.view = b.dataset.v; UI.drawer = null; render(); window.scrollTo(0, 0); break;
    case 'step': UI.step = b.dataset.s; UI.confirm = null; render(); window.scrollTo(0, 0); break;
    case 'open': UI.drawer = +b.dataset.id; render(); break;
    case 'close': UI.drawer = null; render(); break;
    case 'sort': { const k = b.dataset.k, t = b.dataset.tbl, cur = UI.sort[t] || { k: 'ix', dir: -1 }; UI.sort[t] = { k, dir: cur.k === k ? -cur.dir : -1 }; render(); break; }
    case 'toggle': if (!d) break; toggleIn(d[b.dataset.set], +b.dataset.id, b.type === 'checkbox' ? b.checked : undefined); afterChange(); break;
    case 'selall': if (!d) break; for (const id of ids(b.dataset.ids)) toggleIn(d[b.dataset.set], id, b.checked); afterChange(); break;
    case 'gfclear': UI.gf = { prnp: 'any', fec: 'any', tm: 'any' }; render(); break;
    case 'repsex': UI.repSex = b.dataset.v; render(); break;
    case 'cullsex': UI.cullSex = b.dataset.v; render(); break;
    case 'bookg': UI.bookGroup = b.dataset.v; render(); break;
    case 'keeptop': {
      const n = Math.max(0, +document.getElementById('keepN').value || 0); if (UI.repSex === 'F') UI.keepN = n; else UI.keepRN = n;
      const g = SIM.currentGroups(st), pool = applyHide((UI.repSex === 'F' ? g.eweLambs : g.ramLambs).filter(x => !x.term)).sort((a, b2) => rankVal(b2) - rankVal(a));
      for (const x of (UI.repSex === 'F' ? g.eweLambs : g.ramLambs)) toggleIn(d.retain, x.id, false);
      pool.slice(0, n).forEach(x => toggleIn(d.retain, x.id, true)); afterChange(); break;
    }
    case 'clearret': { const g = SIM.currentGroups(st); for (const x of (UI.repSex === 'F' ? g.eweLambs : g.ramLambs)) toggleIn(d.retain, x.id, false); afterChange(); break; }
    case 'cullage': { UI.cullAge = +document.getElementById('cullAge').value || 7; SIM.currentGroups(st).ewes.forEach(x => { if (age(x) >= UI.cullAge) toggleIn(d.cull, x.id, true); }); afterChange(); break; }
    case 'cullbottom': { UI.cullN = Math.max(0, +document.getElementById('cullN').value || 0); SIM.currentGroups(st).ewes.filter(x => !has(d.cull, x.id)).sort((a, b2) => rankVal(a) - rankVal(b2)).slice(0, UI.cullN).forEach(x => toggleIn(d.cull, x.id, true)); afterChange(); break; }
    case 'cullopp': { const g = SIM.currentGroups(st); (UI.cullSex === 'F' ? g.ewes : g.rams).forEach(x => { if ((x.ot && x.ot[1]) || SIM.oppClinical(x, st.year)) toggleIn(d.cull, x.id, true); }); afterChange(); break; }
    case 'cullqq': { const g = SIM.currentGroups(st); (UI.cullSex === 'F' ? g.ewes : g.rams).forEach(x => { if (x.pk && SIM.codon171(x.prnp) === 'QQ') toggleIn(d.cull, x.id, true); }); afterChange(); break; }
    case 'clearcull': { const g = SIM.currentGroups(st); (UI.cullSex === 'F' ? g.ewes : g.rams).forEach(x => toggleIn(d.cull, x.id, false)); afterChange(); break; }
    case 'askgeno': UI.confirm = { kind: 'geno' }; render(); break;
    case 'genog': UI.genoGroup = b.dataset.v; UI.genoN = null; render(); break;
    case 'clrgeno': d.genoSel = []; UI.confirm = null; afterChange(); break;
    case 'genotop': {
      const n = Math.max(0, +document.getElementById('genoN').value || 0); UI.genoN = n;
      const pool = genoPool(UI.genoGroup || 'ramlambs').sort((a, b2) => rankVal(b2) - rankVal(a));
      for (const x of genoPool(UI.genoGroup || 'ramlambs')) toggleIn(d.genoSel, x.id, false);
      pool.slice(0, n).forEach(x => toggleIn(d.genoSel, x.id, true)); afterChange(); break;
    }
    case 'askopp': UI.confirm = { kind: 'opp' }; render(); break;
    case 'cancel': UI.confirm = null; render(); break;
    case 'dogeno': {
      const list = d.genoSel.filter(id => { const x = A(id); return x && SIM.inFlock(x) && !x.gen; }); UI.confirm = null;
      await busy('Running the SNP panel…', () => { const n = SIM.genotype(st, list); SIM.computeEBV(st); d.genoSel = []; toast(`Genotyped ${n} head. EBVs updated.`); });
      afterChange(); break;
    }
    case 'geno1': await busy('Genotyping…', () => { SIM.genotype(st, [+b.dataset.id]); SIM.computeEBV(st); }); afterChange(); break;
    case 'doopp': {
      UI.confirm = null;
      const r = SIM.oppTest(st, d.oppSel.slice()); d.oppSel = [];
      toast(`${r.n} head tested: ${r.pos} positive.`); afterChange(); break;
    }
    case 'opp1': { const r = SIM.oppTest(st, [+b.dataset.id]); toast(r.pos ? 'OPP test: positive.' : 'OPP test: negative.'); afterChange(); break; }
    case 'oppg': UI.oppGroup = b.dataset.v; render(); break;
    case 'clropp': d.oppSel = []; UI.confirm = null; afterChange(); break;
    case 'oppsigns': oppPool(UI.oppGroup || 'ewes').forEach(x => { if (SIM.oppClinical(x, st.year)) toggleIn(d.oppSel, x.id, true); }); afterChange(); break;
    case 'oppnever': oppPool(UI.oppGroup || 'ewes').forEach(x => { if (!x.ot) toggleIn(d.oppSel, x.id, true); }); afterChange(); break;
    case 'buy': await busy('Hauling your ram home…', () => { const x = SIM.buyRam(st, b.dataset.lot); if (x) { buildTags(); toggleIn(dec().sires, x.id, true); toast(`Bought lot ${b.dataset.lot.slice(1)}. Tag ${tag(x.id)}.`); } }); afterChange(); break;
    case 'return': if (SIM.returnRam(st, +b.dataset.id)) { toggleIn(d.sires, +b.dataset.id, false); SIM.computeEBV(st); toast('Ram returned and refunded.'); } afterChange(); break;
    case 'unbid': delete d.bids[b.dataset.lot]; afterChange(); break;
    case 'method': d.method = b.dataset.v; afterChange(); break;
    case 'bulkassign': { const sid = +document.getElementById('bulkSire').value; UI.bulkSire = sid; for (const id of d.mateSel) d.assign[id] = sid; d.mateSel = []; afterChange(); break; }
    case 'bulkauto': for (const id of d.mateSel) delete d.assign[id]; d.mateSel = []; afterChange(); break;
    case 'clearassign': d.assign = {}; afterChange(); break;
    case 'termbottom': { UI.termN = Math.max(0, +document.getElementById('termN').value || 0); const pool = SIM.eligibleEwes(st, engineDec()).filter(x => +d.assign[x.id] !== SIM.TERM).sort((a, b2) => rankVal(a) - rankVal(b2)); pool.slice(0, UI.termN).forEach(x => { d.assign[x.id] = SIM.TERM; }); afterChange(); break; }
    case 'termage': { UI.termAge = +document.getElementById('termAge').value || 6; SIM.eligibleEwes(st, engineDec()).forEach(x => { if (age(x) >= UI.termAge) d.assign[x.id] = SIM.TERM; }); afterChange(); break; }
    case 'termclear': for (const k in d.assign) if (+d.assign[k] === SIM.TERM) delete d.assign[k]; afterChange(); break;
    case 'savesub': await saveSubmission(+b.dataset.r); break;
    case 'nom': {
      const id = +b.dataset.id;
      if (b.checked) {
        const g = SIM.currentGroups(st), rams = new Set(g.rams.concat(g.ramLambs).map(x => x.id));
        const n = Object.keys(d.noms).filter(k => rams.has(+k)).length;
        if (n >= st.settings.maxNominate) { b.checked = false; toast(`You can nominate up to ${st.settings.maxNominate} rams. Untick one first.`); break; }
        d.noms[id] = st.settings.strawDefault;
      } else delete d.noms[id];
      afterChange(); break;
    }
    case 'commit': {
      const ed = engineDec(); if (SIM.validate(st, ed).errs.length) break;
      { const be = SIM.breedersEq(st, joinPlan().plan); ed.beq = { pa: be.pa, dG: be.dG, Ss: be.sire.S, Sd: be.dam.S, Ls: be.sire.L, Ld: be.dam.L, nTerm: be.nTerm }; }
      const y0 = st.year;
      await busy(`Wintering on the range and lambing in spring ${cal(y0 + 1)}…`, () => {
        const sub = st.practice ? null : SIM.makeSubmission(st, ed);
        if (sub) sub.noms.forEach(n => { n.tag = tag(n.id); });
        SIM.commitYear(st, ed);
        if (sub) { sub.use = (st.aiUse && st.aiUse[sub.round]) || []; sub.summary = SIM.summary(st); st.subs = st.subs || {}; st.subs[sub.round] = sub; }
        st.pending = null; st.repaired = false; buildTags(); DAM = null; LIT = null;
      });
      UI.step = 'report'; UI.confirm = null; UI.drawer = null; afterChange(); window.scrollTo(0, 0);
      toast(finished() ? 'Last lamb crop is on the ground. See your final report.' : `Spring ${cal(st.year)}: ${st.hist[st.year].born} lambs born.`);
      break;
    }
    case 'csv': await offerFile(`flock-forward-${slug(st.name)}-${cal(st.year)}.csv`, flockCSV()); break;
    case 'savefile': await offerFile(`flock-forward-${slug(st.name)}-round${finished() ? 'final' : round()}.json`, JSON.stringify({ app: 'fleeceline-save', v: 1, name: st.name, seed: st.seed, year: st.year, data: packState() })); break;
    case 'copysave': await copyText(packState(), 'Save code'); break;
    case 'loadpaste': {
      const code = document.getElementById('pasteSave').value;
      try { await busy('Loading game…', () => { st = unpackState(code); st.practice = false; buildTags(); DAM = null; LIT = null; }); UI.pasteSave = ''; UI.view = 'season'; UI.step = 'report'; afterChange(); toast('Game loaded.'); }
      catch (err) { toast(err.message || 'That save code could not be read.'); }
      break;
    }
    case 'newask': readNewForm(); UI.newForm.confirm = true; render(); break;
    case 'cancelnew': UI.newForm.confirm = false; render(); break;
    case 'newgo': {
      readNewForm(); const nf = UI.newForm;
      if (!nf.name.trim() || !nf.code.trim()) { nf.confirm = false; render(); toast('Enter your name and class code.'); break; }
      let settings = {};
      if (nf.settingsCode.trim()) { try { const o = parseClass(nf.settingsCode.trim()); settings = o.settings; } catch (err) { toast('The class settings code could not be read.'); break; } }
      await busy('Gathering the flock…', () => { st = SIM.newGame({ name: nf.name.trim(), classCode: nf.code.trim(), settings }); buildTags(); DAM = null; LIT = null; });
      UI.newForm = null; UI.view = 'season'; UI.step = 'report'; afterChange(); window.scrollTo(0, 0); break;
    }
    case 'clsfile': { const c = clsState(); readCls(); await offerFile(`flock-forward-class-${slug(c.code)}.json`, JSON.stringify({ app: 'fleeceline-class', v: 1, classCode: c.code, settings: c.settings })); break; }
    case 'clscopy': { const c = clsState(); readCls(); await copyText(btoa(unescape(encodeURIComponent(JSON.stringify({ app: 'fleeceline-class', classCode: c.code, settings: c.settings })))), 'Class settings code'); break; }
    case 'clsclear': UI.classRows = []; render(); break;
    case 'pick': {
      const c = clsState(), { list } = roundSubs(), noms = nominees(list);
      if (!UI.pickKeys) UI.pickKeys = autoPicks(noms, c.settings);
      const k = b.dataset.k, i = UI.pickKeys.indexOf(k);
      if (i >= 0) UI.pickKeys.splice(i, 1); else UI.pickKeys.push(k);
      UI.pickKeys = noms.map(p => p.nom.key + '|' + p.fid).filter(x => UI.pickKeys.includes(x));   // keep rank order
      render(); break;
    }
    case 'pickauto': UI.pickKeys = null; render(); break;
    case 'subsclear': UI.subs = []; UI.pickKeys = null; UI.closeRound = null; UI.bRound = null; render(); break;
    case 'subscompare': { const { list } = roundSubs(); for (const x of list) if (x.summary) { UI.classRows = UI.classRows.filter(r => r.fid !== x.fid); UI.classRows.push(Object.assign({ fid: x.fid }, x.summary)); } render(); toast(`${list.length} students added to the comparison.`); break; }
    case 'savebull': {
      const c = clsState(), { R, list } = roundSubs(), noms = nominees(list);
      const picks = UI.pickKeys || autoPicks(noms, c.settings);
      const picked = noms.filter(p => picks.includes(p.nom.key + '|' + p.fid));
      const code = list.length ? majority(list.map(x => x.classCode)) : c.code;
      const n = +document.getElementById('bRound').value || (R != null ? R + 1 : 2);
      UI.bDeadline = document.getElementById('bDeadline').value; UI.bNote = document.getElementById('bNote').value;
      const bull = SIM.buildBulletin({ classCode: code, baseSig: list.length ? majority(list.map(x => x.baseSig)) : null, round: n, subs: list, picks: picked, deadline: UI.bDeadline.trim(), note: UI.bNote.trim() });
      await offerFile(`flock-forward-${slug(code)}-round${n}-class-file.json`, JSON.stringify(bull)); break;
    }
    case 'clstry': readCls(); UI.clsTry = true; render(); break;
    case 'clstryno': UI.clsTry = false; render(); break;
    case 'clstrygo': {
      const c = clsState(); readCls(); UI.clsTry = false;
      await busy('Gathering the flock…', () => { st = SIM.newGame({ name: 'Instructor test', classCode: c.code, settings: JSON.parse(JSON.stringify(c.settings)) }); buildTags(); DAM = null; LIT = null; });
      UI.view = 'season'; UI.step = 'report'; afterChange(); window.scrollTo(0, 0); toast('Test game started with your class settings.'); break;
    }
    case 'clsdefaults': UI.cls = { code: clsState().code, settings: SIM.defaultSettings() }; render(); toast('Class settings reset to defaults.'); break;
    case 'hideinstr': hideInstructor(); UI.view = 'season'; render(); window.scrollTo(0, 0); toast('Instructor tab hidden. Open the link with #instructor to bring it back.'); break;
    case 'pathreset': { const cs = clsState().settings; cs.lambIdx = null; cs.woolPath = null; UI.pricesOpen = true; render(); break; }
    case 'pathflat': { const cs = clsState().settings, n = cs.rounds + 1; cs.lambIdx = Array(n).fill(1); cs.woolPath = Array(n).fill(1); UI.pricesOpen = true; render(); break; }
  }
});
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'game';
function readNewForm() {
  const nf = UI.newForm || (UI.newForm = {});
  const g = id => document.getElementById(id);
  if (g('nfName')) nf.name = g('nfName').value; if (g('nfCode')) nf.code = g('nfCode').value; if (g('nfSettings')) nf.settingsCode = g('nfSettings').value;
}
function readCls() { const e = document.getElementById('clsCode'); if (e) clsState().code = e.value.trim() || 'CLASS'; }
function parseClass(text) {
  let o; try { o = JSON.parse(text); } catch (e) { o = JSON.parse(decodeURIComponent(escape(atob(text)))); }
  if (!o || o.app !== 'fleeceline-class') throw new Error('not a class file');
  return o;
}
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.act === 'nomprice') { const s = st.settings; dec().noms[t.dataset.id] = Math.round(Math.max(s.strawMin, Math.min(s.strawMax, +t.value || s.strawDefault))); afterChange(); return; }
  if (t.id === 'bullFile' && t.files[0]) { await loadBulletinFile(t.files[0]); return; }
  if (t.dataset.act === 'rankby') { UI.rankBy = t.value; render(); return; }
  if (t.dataset.act === 'gfilt') { UI.gf[t.dataset.k] = t.value; render(); return; }
  if (t.dataset.act === 'bid') {
    const d = dec(), r = st.market.find(m => m.lot === t.dataset.lot); if (!r) return;
    if (t.value === '') delete d.bids[r.lot];
    else { const v = Math.round(+t.value); if (v < r.price) { toast(`Lot ${r.lot.slice(1)} opens at ${money(r.price)}.`); d.bids[r.lot] = r.price; } else d.bids[r.lot] = v; }
    afterChange(); return;
  }
  if (t.dataset.act === 'assign') { const d = dec(); if (t.value === '') delete d.assign[t.dataset.e]; else d.assign[t.dataset.e] = +t.value; afterChange(); return; }
  if (t.id === 'bulkSire') { UI.bulkSire = +t.value; return; }
  if (t.dataset.act === 'quota') { const d = dec(); if (t.value === '') delete d.quotas[t.dataset.id]; else d.quotas[t.dataset.id] = Math.max(0, Math.min(st.settings.maxEwesPerRam, +t.value)); afterChange(); return; }
  if (t.dataset.act === 'clssync') { clsState().settings.classSync = t.checked; saveCls(); return; }
  if (t.dataset.act === 'closeround') { UI.closeRound = +t.value; UI.pickKeys = null; UI.bRound = null; render(); return; }
  if (t.id === 'bRound') { UI.bRound = +t.value || null; render(); return; }
  if (t.id === 'bDeadline') { UI.bDeadline = t.value; return; }
  if (t.id === 'bNote') { UI.bNote = t.value; return; }
  if (t.id === 'subFiles' && t.files.length) {
    let n = 0, bad = 0; UI.subs = UI.subs || [];
    for (const f of Array.from(t.files)) {
      try { const o = JSON.parse(await f.text()); if (o.app !== 'ewedecide-sub') { bad++; continue; } UI.subs = UI.subs.filter(x => !(x.fid === o.fid && x.round === o.round)); UI.subs.push(o); n++; }
      catch (e) { bad++; }
    }
    UI.pickKeys = null; UI.bRound = null; render();
    toast(`${n} submission${n === 1 ? '' : 's'} loaded${bad ? `, ${bad} file${bad === 1 ? '' : 's'} skipped (not a round submission)` : ''}.`);
    return;
  }
  if (t.dataset.act === 'clsset') { const cs = clsState().settings; cs[t.dataset.k] = +t.value; saveCls();
    if (/^(base|sale)(ARR|VRQ|FecB|TM\d)$/.test(t.dataset.k)) { UI.genesOpen = true; render(); return; } if (t.dataset.k === 'flockSize') cs.femaleCap = Math.round(cs.flockSize * 1.25);
    if (['flockSize', 'rounds', 'lambPriceSD', 'woolPriceSD', 'priceRho'].includes(t.dataset.k)) { if (t.dataset.k === 'rounds') { cs.lambIdx = null; cs.woolPath = null; } render(); }
    return; }
  if (t.dataset.act === 'clspath') {
    const c = clsState(), cs = c.settings, gen = SIM.genPrices(c.code, cs), n = cs.rounds + 1;
    if (!cs.lambIdx) cs.lambIdx = gen.lamb.slice(0, n);
    if (!cs.woolPath) cs.woolPath = gen.wool.slice(0, n);
    const i = +t.dataset.i, v = Math.max(0, +t.value || 0);
    if (t.dataset.p === 'lamb') cs.lambIdx[i] = v / 100; else cs.woolPath[i] = v / 100;
    UI.pricesOpen = true; render(); return;
  }
  if (t.dataset.act === 'clsslide') { clsState().settings.lambSlide[+t.dataset.i][1] = Math.max(0, +t.value || 0); render(); return; }
  if (t.dataset.act === 'clswool') { clsState().settings.woolPrices[+t.dataset.i][1] = +t.value; saveCls(); return; }
  if (t.dataset.act === 'clsmul') { clsState().settings.idxMul[+t.dataset.k] = +t.value; render(); return; }
  if (t.id === 'clsCode') { readCls(); saveCls(); render(); return; }
  if (t.id === 'loadFile' && t.files[0]) {
    try {
      const o = JSON.parse(await t.files[0].text());
      if (o.app !== 'fleeceline-save') throw new Error('This is not a save file for ' + APP_NAME + '.');
      await busy('Loading game…', () => { st = unpackState(o.data); st.practice = false; buildTags(); DAM = null; LIT = null; });
      UI.view = 'season'; UI.step = 'report'; afterChange(); toast('Game loaded.');
    } catch (err) { toast(err.message || 'That file could not be read.'); }
    return;
  }
  if (t.id === 'clsLoad' && t.files[0]) {
    try { const o = parseClass(await t.files[0].text()); UI.cls = { code: o.classCode || clsState().code, settings: Object.assign(SIM.defaultSettings(), o.settings) }; render(); toast('Class settings loaded for editing.'); }
    catch (err) { toast('That is not a class settings file for ' + APP_NAME + '.'); }
    return;
  }
  if (t.id === 'nfFile' && t.files[0]) {
    try { const o = parseClass(await t.files[0].text()); readNewForm(); UI.newForm.settingsCode = btoa(unescape(encodeURIComponent(JSON.stringify(o)))); if (!UI.newForm.code) UI.newForm.code = o.classCode || ''; render(); toast('Class settings loaded.'); }
    catch (err) { toast('That is not a class settings file for ' + APP_NAME + '.'); }
    return;
  }
  if (t.id === 'classFiles' && t.files.length) {
    const files = Array.from(t.files);
    await busy(`Reading ${files.length} game${files.length > 1 ? 's' : ''}…`, async () => {
      for (const f of files) {
        try { const o = JSON.parse(await f.text()); if (o.app !== 'fleeceline-save') continue; const g = unpackState(o.data); UI.classRows.push(SIM.summary(g)); await tick(); }
        catch (err) { toast('Skipped ' + f.name + ': not a readable save.'); }
      }
    });
    render(); return;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') { UI.search = t.value; clearTimeout(t._t); t._t = setTimeout(() => { render(); const s = document.getElementById('search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 200); }
  if (t.id === 'pasteSave') UI.pasteSave = t.value;
  if (['nfName', 'nfCode', 'nfSettings'].includes(t.id)) readNewForm();
});
document.addEventListener('toggle', e => { const t = e.target; if (t.dataset && t.dataset.k === 'prices') UI.pricesOpen = t.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.drawer) { UI.drawer = null; render(); } });

/* ============ boot ============ */
async function boot() {
  UI.busy = 'Gathering the flock…'; renderOverlays();
  await tick();
  st = loadLocal();
  if (!st) { st = SIM.newGame({ name: 'Practice flock', classCode: 'PRACTICE' }); st.practice = true; }
  buildTags();
  if (location.hash === '#instructor') UI.view = 'instructor';
  UI.busy = null; renderOverlays();
  render(); save();
}
boot();
})();
</script>
</body></html>
